name: Daily news publication

on:
  schedule:
    # 08:00 KST, Monday through Friday (23:00 UTC, Sunday through Thursday)
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect, validate, and save today's brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KOREA_HOLIDAY_SERVICE_KEY: ${{ secrets.KOREA_HOLIDAY_SERVICE_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: node scripts/refresh-daily-news.mjs
      - name: Commit the new issue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livart-daily/data/briefs.json
          if git diff --cached --quiet; then
            echo "No new issue to publish."
          else
            git commit -m "Publish daily news ${GITHUB_RUN_STARTED_AT:-$(date -u +%F)}"
            git push
          fi
