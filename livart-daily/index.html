<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>경제·물류 주요뉴스</title>  <script type="module" crossorigin src="./assets/index-PRINTLINK6.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-PRINTLINK6.css">
</head><body><div id="root"></div><script>(function(){document.addEventListener("click",function(event){const button=event.target.closest('button[aria-label="이전 날짜"], button[aria-label="다음 날짜"]');if(!button||button.disabled)return;const picker=document.querySelector('select[aria-label="날짜 선택"]');if(!picker)return;event.preventDefault();event.stopImmediatePropagation();const offset=button.getAttribute("aria-label")==="이전 날짜"?1:-1;const next=picker.selectedIndex+offset;if(next<0||next>=picker.options.length)return;picker.selectedIndex=next;picker.dispatchEvent(new Event("change",{bubbles:true}));},true);})();</script></body></html>
